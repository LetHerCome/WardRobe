<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="WardRobe">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<title>WardRobe</title>
<style>
:root{--bg:#f6f2ec;--paper:#fffdf9;--ink:#171513;--muted:#79716a;--line:#e4dbd2;--soft:#eee7df;--shadow:0 18px 42px rgba(52,40,31,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{overscroll-behavior-y:none}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}.shell{width:min(100%,430px);margin:0 auto;min-height:100svh;padding:18px 18px calc(96px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.title{font-family:Georgia,"Times New Roman",serif;font-size:48px;line-height:.98;letter-spacing:-2px;font-weight:500;margin:4px 0 18px}.round-btn{width:46px;height:46px;min-width:46px;min-height:46px;border:1px solid var(--line);background:rgba(255,253,249,.86);border-radius:50%;display:grid;place-items:center;font-size:19px}.greeting{font-size:18px;font-weight:720;letter-spacing:-.15px}.subtitle{font-size:13px;color:var(--muted);margin:4px 0 16px}.hero{position:relative;height:clamp(430px,58svh,510px);border:1px solid rgba(218,207,197,.82);border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#ede4dc 0%,#e7dbd1 100%);box-shadow:var(--shadow);isolation:isolate}.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 52% 15%,rgba(255,255,255,.7),transparent 30%),linear-gradient(90deg,rgba(255,255,255,.18),transparent 38%);z-index:-1}.room-line{position:absolute;right:22px;top:126px;width:82px;height:235px;border-left:2px solid rgba(104,82,67,.18);border-top:2px solid rgba(104,82,67,.18);border-radius:15px 0 0 0}.room-line::after{content:"";position:absolute;left:-30px;top:76px;width:112px;height:2px;background:rgba(104,82,67,.15)}.pedestal{position:absolute;left:-16px;bottom:0;width:112px;height:120px;border-radius:20px 20px 0 0;background:rgba(255,250,245,.52);border:1px solid rgba(255,255,255,.4)}.avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:91%;width:auto;max-width:64%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 16px 22px rgba(50,36,27,.09));user-select:none;pointer-events:none}.hero-chip{position:absolute;top:14px;min-height:61px;padding:10px 12px;border:1px solid rgba(225,216,208,.95);border-radius:17px;background:rgba(255,253,249,.91);backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(55,42,33,.055);display:flex;flex-direction:column;justify-content:center}.hero-chip.weather{left:12px;min-width:104px;cursor:pointer}.hero-chip.occasion{right:12px;min-width:112px;text-align:right;align-items:flex-end}.chip-main{font-size:16px;font-weight:760;line-height:1.1}.chip-sub{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.2}.occasion-label{font-size:9px;color:var(--muted);margin-bottom:3px}.hero-cta{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);min-height:50px;border:0;border-radius:999px;background:#151311;color:#fff;padding:0 24px;min-width:180px;font-size:13px;font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,.18)}.hero-cta:active,.round-btn:active,.stat:active,.nav button:active{transform:scale(.98)}.hero-cta:active{transform:translateX(-50%) scale(.98)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.stat{min-height:78px;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:12px 13px;text-align:left}.stat small{display:block;color:var(--muted);font-size:9.5px}.stat strong{display:block;font-size:15px;margin:5px 0 2px;letter-spacing:-.15px}.placeholder{padding:90px 18px;text-align:center}.placeholder h2{font-family:Georgia,"Times New Roman",serif;font-size:36px;font-weight:500;margin:0 0 8px}.placeholder p{font-size:13px;color:var(--muted);line-height:1.5}.nav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 22px),408px);height:70px;border:1px solid var(--line);border-radius:23px;background:rgba(255,253,249,.95);backdrop-filter:blur(18px);box-shadow:0 14px 34px rgba(45,34,27,.11);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#77706a;font-size:9.5px;font-weight:700}.nav .icon{font-size:19px;line-height:1}.nav button.active{color:#151311}.weather-loading{opacity:.65}@media(max-width:360px){.shell{padding-left:14px;padding-right:14px}.title{font-size:44px}.hero{height:430px}.avatar{height:88%;max-width:68%}.hero-chip{top:11px}.hero-chip.weather{left:10px}.hero-chip.occasion{right:10px}.nav{width:calc(100% - 18px)}}
</style>
</head>
<body>
<main class="shell">
<section class="screen active" data-screen="home">
  <div class="header"><h1 class="title">Home</h1><button class="round-btn" aria-label="Impostazioni">⚙</button></div>
  <div class="greeting">Good morning, Bea ☀️</div>
  <div class="subtitle">Pronta a creare qualcosa di bello?</div>

  <section class="hero" aria-label="Look del giorno">
    <div class="pedestal"></div><div class="room-line"></div>
    <button class="hero-chip weather" id="weatherCard" aria-label="Aggiorna meteo">
      <span class="chip-main" id="weatherTemp">--° ···</span>
      <span class="chip-sub" id="weatherText">Tocca per il meteo</span>
    </button>
    <div class="hero-chip occasion">
      <span class="occasion-label">Occasione</span>
      <span class="chip-main">Everyday⌄</span>
    </div>
    <img class="avatar" src="./assets/avatar.png" alt="Avatar WardRobe">
    <button class="hero-cta" data-open="dressing">Change look&nbsp; →</button>
  </section>

  <section class="stats" aria-label="Riepilogo">
    <button class="stat" data-open="looks"><small>Ultimo look salvato</small><strong>Dinner date</strong><small>2 giorni fa</small></button>
    <button class="stat" data-open="wardrobe"><small>Capi aggiunti</small><strong>12</strong><small>Questa settimana</small></button>
  </section>
</section>

<section class="screen" data-screen="wardrobe"><div class="placeholder"><h2>Wardrobe</h2><p>La rifacciamo dopo la Home.</p></div></section>
<section class="screen" data-screen="dressing"><div class="placeholder"><h2>Dressing</h2><p>La rifacciamo dopo la Home.</p></div></section>
<section class="screen" data-screen="looks"><div class="placeholder"><h2>Looks</h2><p>La rifacciamo dopo la Home.</p></div></section>
</main>

<nav class="nav" aria-label="Navigazione principale">
  <button class="active" data-open="home"><span class="icon">⌂</span>Home</button>
  <button data-open="wardrobe"><span class="icon">♧</span>Wardrobe</button>
  <button data-open="dressing"><span class="icon">♙</span>Dressing</button>
  <button data-open="looks"><span class="icon">♡</span>Looks</button>
</nav>

<script>
const screens=[...document.querySelectorAll('[data-screen]')];
const navButtons=[...document.querySelectorAll('.nav [data-open]')];
function openScreen(name){screens.forEach(s=>s.classList.toggle('active',s.dataset.screen===name));navButtons.forEach(b=>b.classList.toggle('active',b.dataset.open===name));window.scrollTo(0,0)}
document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openScreen(button.dataset.open)));

const weatherCard=document.getElementById('weatherCard');
const weatherTemp=document.getElementById('weatherTemp');
const weatherText=document.getElementById('weatherText');
const weatherCodes={0:['☀️','Sereno'],1:['🌤️','Quasi sereno'],2:['⛅','Parzialmente nuvoloso'],3:['☁️','Nuvoloso'],45:['🌫️','Nebbia'],48:['🌫️','Nebbia'],51:['🌦️','Pioviggine'],53:['🌦️','Pioviggine'],55:['🌧️','Pioviggine'],61:['🌧️','Pioggia'],63:['🌧️','Pioggia'],65:['🌧️','Pioggia forte'],71:['🌨️','Neve'],73:['🌨️','Neve'],75:['❄️','Neve forte'],80:['🌦️','Rovesci'],81:['🌧️','Rovesci'],82:['⛈️','Rovesci forti'],95:['⛈️','Temporale'],96:['⛈️','Temporale'],99:['⛈️','Temporale']};
function setWeatherState(temp,code,label='Posizione attuale'){const [icon,text]=weatherCodes[code]||['🌤️','Meteo'];weatherTemp.textContent=`${Math.round(temp)}° ${icon}`;weatherText.textContent=`${text} · ${label}`;weatherCard.classList.remove('weather-loading');localStorage.setItem('wardrobe-weather',JSON.stringify({temp,code,at:Date.now()}))}
function weatherFallback(message='Posizione non disponibile'){const saved=JSON.parse(localStorage.getItem('wardrobe-weather')||'null');if(saved&&Date.now()-saved.at<6*60*60*1000){setWeatherState(saved.temp,saved.code,'ultimo aggiornamento');return}weatherTemp.textContent='22° ☀️';weatherText.textContent=message;weatherCard.classList.remove('weather-loading')}
async function loadWeather(){weatherCard.classList.add('weather-loading');weatherTemp.textContent='--° ···';weatherText.textContent='Aggiornamento…';if(!navigator.geolocation){weatherFallback();return}navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude,longitude}=pos.coords;const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&timezone=auto`;const res=await fetch(url);if(!res.ok)throw new Error('weather');const data=await res.json();setWeatherState(data.current.temperature_2m,data.current.weather_code)}catch(e){weatherFallback('Meteo non disponibile')}},()=>weatherFallback('Tocca per riprovare'),{enableHighAccuracy:false,timeout:7000,maximumAge:20*60*1000})}
weatherCard.addEventListener('click',loadWeather);
window.addEventListener('load',()=>{loadWeather();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
</body>
</html>
