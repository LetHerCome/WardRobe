<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="WardRobe">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>WardRobe</title>
<style>
:root{--bg:#f6f2ec;--paper:#fffdf9;--ink:#171513;--muted:#827a73;--line:#e4dbd2;--shadow:0 16px 36px rgba(52,40,31,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{overscroll-behavior-y:none}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}.shell{width:min(100%,430px);margin:0 auto;min-height:100svh;padding:26px 18px calc(104px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.header{display:flex;align-items:center;justify-content:space-between;gap:16px}.title{font-family:Georgia,"Times New Roman",serif;font-size:46px;line-height:1;letter-spacing:-1.8px;font-weight:500;margin:0 0 20px}.round-btn{width:44px;height:44px;min-width:44px;min-height:44px;border:1px solid var(--line);background:rgba(255,253,249,.86);border-radius:50%;display:grid;place-items:center;font-size:18px}.greeting{font-size:17px;font-weight:720;letter-spacing:-.15px}.subtitle{font-size:13px;color:var(--muted);margin:4px 0 14px}.hero{position:relative;height:400px;border:1px solid rgba(218,207,197,.9);border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#f1e9e2 0%,#e9ddd3 100%);box-shadow:var(--shadow)}.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.74),transparent 31%),linear-gradient(90deg,rgba(255,255,255,.18),transparent 42%)}.room-line{position:absolute;right:24px;top:118px;width:76px;height:205px;border-left:2px solid rgba(104,82,67,.13);border-top:2px solid rgba(104,82,67,.13);border-radius:14px 0 0 0}.room-line::after{content:"";position:absolute;left:-26px;top:72px;width:100px;height:2px;background:rgba(104,82,67,.12)}.pedestal{position:absolute;left:-12px;bottom:0;width:104px;height:100px;border-radius:18px 18px 0 0;background:rgba(255,250,245,.48);border:1px solid rgba(255,255,255,.35)}.avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:86%;width:auto;max-width:58%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 14px 20px rgba(50,36,27,.08));user-select:none;pointer-events:none}.hero-chip{position:absolute;top:12px;height:68px;padding:9px 11px;border:1px solid rgba(225,216,208,.95);border-radius:16px;background:rgba(255,253,249,.92);backdrop-filter:blur(12px);box-shadow:0 7px 18px rgba(55,42,33,.045);display:flex;flex-direction:column;justify-content:center;z-index:3}.hero-chip.weather{left:12px;min-width:118px;max-width:138px;text-align:left;cursor:pointer}.hero-chip.occasion{right:12px;width:118px;text-align:right;align-items:flex-end}.chip-main{font-size:15px;font-weight:760;line-height:1.05;white-space:nowrap}.chip-sub{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:116px}.occasion-label{font-size:8.5px;color:var(--muted);margin-bottom:4px}.hero-cta{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);height:48px;border:0;border-radius:999px;background:#151311;color:#fff;padding:0 24px;min-width:176px;font-size:13px;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.16);z-index:4}.hero-cta:active{transform:translateX(-50%) scale(.98)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.stat{min-height:74px;border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:11px 12px;text-align:left}.stat small{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;font-size:14px;margin:5px 0 2px;letter-spacing:-.1px}.placeholder{padding:90px 18px;text-align:center}.placeholder h2{font-family:Georgia,"Times New Roman",serif;font-size:36px;font-weight:500;margin:0 0 8px}.placeholder p{font-size:13px;color:var(--muted);line-height:1.5}.nav{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 22px),408px);height:64px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,249,.96);backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(45,34,27,.10);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#77706a;font-size:9px;font-weight:700}.nav .icon{font-size:18px;line-height:1}.nav button.active{color:#151311}.weather-loading{opacity:.64}@media(max-width:360px){.shell{padding:22px 14px calc(100px + env(safe-area-inset-bottom))}.title{font-size:43px}.hero{height:382px}.avatar{height:84%;max-width:62%}.hero-chip.weather{min-width:112px;max-width:126px}.hero-chip.occasion{width:110px}.nav{width:calc(100% - 18px)}}
</style>
</head>
<body>
<main class="shell">
<section class="screen active" data-screen="home">
  <div class="header"><h1 class="title">Home</h1><button class="round-btn" aria-label="Impostazioni">⚙</button></div>
  <div class="greeting">Good morning, Bea ☀️</div>
  <div class="subtitle">Pronta a creare qualcosa di bello?</div>

  <section class="hero" aria-label="Look del giorno">
    <div class="pedestal"></div><div class="room-line"></div>
    <button class="hero-chip weather" id="weatherCard" aria-label="Aggiorna meteo">
      <span class="chip-main" id="weatherTemp">22° ☀️</span>
      <span class="chip-sub" id="weatherText">Tocca per il meteo</span>
    </button>
    <div class="hero-chip occasion">
      <span class="occasion-label">Occasione</span>
      <span class="chip-main">Everyday⌄</span>
    </div>
    <img class="avatar" src="./avatar.png" alt="Avatar WardRobe">
    <button class="hero-cta" data-open="dressing">Change look&nbsp; →</button>
  </section>

  <section class="stats" aria-label="Riepilogo">
    <button class="stat" data-open="looks"><small>Ultimo look salvato</small><strong>Dinner date</strong><small>2 giorni fa</small></button>
    <button class="stat" data-open="wardrobe"><small>Capi aggiunti</small><strong>12</strong><small>Questa settimana</small></button>
  </section>
</section>

<section class="screen" data-screen="wardrobe"><div class="placeholder"><h2>Wardrobe</h2><p>La rifacciamo dopo la Home.</p></div></section>
<section class="screen" data-screen="dressing"><div class="placeholder"><h2>Dressing</h2><p>La rifacciamo dopo la Home.</p></div></section>
<section class="screen" data-screen="looks"><div class="placeholder"><h2>Looks</h2><p>La rifacciamo dopo la Home.</p></div></section>
</main>

<nav class="nav" aria-label="Navigazione principale">
  <button class="active" data-open="home"><span class="icon">⌂</span>Home</button>
  <button data-open="wardrobe"><span class="icon">♧</span>Wardrobe</button>
  <button data-open="dressing"><span class="icon">♙</span>Dressing</button>
  <button data-open="looks"><span class="icon">♡</span>Looks</button>
</nav>

<script>
const screens=[...document.querySelectorAll('[data-screen]')];
const navButtons=[...document.querySelectorAll('.nav [data-open]')];
function openScreen(name){screens.forEach(s=>s.classList.toggle('active',s.dataset.screen===name));navButtons.forEach(b=>b.classList.toggle('active',b.dataset.open===name));window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>openScreen(button.dataset.open)));

const weatherCard=document.getElementById('weatherCard');
const weatherTemp=document.getElementById('weatherTemp');
const weatherText=document.getElementById('weatherText');
const weatherCodes={0:['☀️','Sereno'],1:['🌤️','Quasi sereno'],2:['⛅','Parzialmente nuvoloso'],3:['☁️','Nuvoloso'],45:['🌫️','Nebbia'],48:['🌫️','Nebbia'],51:['🌦️','Pioviggine'],53:['🌦️','Pioviggine'],55:['🌧️','Pioviggine'],61:['🌧️','Pioggia'],63:['🌧️','Pioggia'],65:['🌧️','Pioggia forte'],71:['🌨️','Neve'],73:['🌨️','Neve'],75:['❄️','Neve forte'],80:['🌦️','Rovesci'],81:['🌧️','Rovesci'],82:['⛈️','Rovesci forti'],95:['⛈️','Temporale'],96:['⛈️','Temporale'],99:['⛈️','Temporale']};
function setWeatherState(temp,code,label='Posizione attuale'){const [icon,text]=weatherCodes[code]||['🌤️','Meteo'];weatherTemp.textContent=`${Math.round(temp)}° ${icon}`;weatherText.textContent=text;weatherCard.title=label;weatherCard.classList.remove('weather-loading');localStorage.setItem('wardrobe-weather',JSON.stringify({temp,code,at:Date.now()}))}
function weatherFallback(message='Tocca per il meteo'){let saved=null;try{saved=JSON.parse(localStorage.getItem('wardrobe-weather')||'null')}catch{}if(saved&&Date.now()-saved.at<6*60*60*1000){setWeatherState(saved.temp,saved.code,'Ultimo aggiornamento');return}weatherTemp.textContent='22° ☀️';weatherText.textContent=message;weatherCard.classList.remove('weather-loading')}
async function loadWeather(){weatherCard.classList.add('weather-loading');weatherTemp.textContent='--° ···';weatherText.textContent='Aggiornamento…';if(!navigator.geolocation){weatherFallback();return}navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude,longitude}=pos.coords;const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&timezone=auto`;const res=await fetch(url);if(!res.ok)throw new Error('weather');const data=await res.json();setWeatherState(data.current.temperature_2m,data.current.weather_code)}catch{weatherFallback('Meteo non disponibile')}},()=>weatherFallback('Tocca per riprovare'),{enableHighAccuracy:false,timeout:7000,maximumAge:20*60*1000})}
weatherCard.addEventListener('click',loadWeather);
window.addEventListener('load',()=>{loadWeather();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
</body>
</html>
