<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2ec"><title>WardRobe</title>
<style>
:root{--bg:#f6f2ec;--paper:#fffdf9;--ink:#171614;--muted:#7c756e;--line:#e2d9d1;--rose:#b87373}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transition:transform .16s ease,opacity .16s ease,background-color .16s ease}button:active{transform:scale(.985);opacity:.92}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 18px 104px}.serif{font-family:Georgia,'Times New Roman',serif}.top{display:flex;align-items:center;justify-content:space-between}.title{font-family:Georgia,serif;font-size:50px;line-height:.94;letter-spacing:-2px;font-weight:500;margin:2px 0 30px}.icon-btn{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:#fffaf6;display:grid;place-items:center;font-size:20px;box-shadow:0 8px 30px rgba(45,36,30,.04)}.greet{font-size:20px;font-weight:650}.sub{font-size:15px;color:var(--muted);margin:5px 0 18px}.hero{position:relative;border-radius:28px;overflow:hidden;background:#e9dfd6;box-shadow:0 20px 50px rgba(42,32,24,.08);min-height:510px}.hero img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;display:block}.chipbox{position:absolute;top:16px;padding:11px 13px;border-radius:17px;background:rgba(255,250,246,.9);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(40,30,22,.06)}.weather{left:14px}.occasion{right:14px}.chipbox b{display:block;font-size:16px}.chipbox small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.cta{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);border:0;border-radius:999px;background:#11100f;color:white;padding:15px 26px;min-width:190px;font-weight:750;box-shadow:0 10px 28px rgba(0,0,0,.18)}.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--paper)}.stat{padding:14px 15px;border:0;background:transparent;text-align:left}.stat+ .stat{border-left:1px solid var(--line)}.stat small{display:block;font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:17px;margin:4px 0 2px}.nav{position:fixed;z-index:30;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),496px);height:68px;border:1px solid var(--line);border-radius:24px;background:rgba(255,253,249,.94);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 14px 40px rgba(34,27,22,.08)}.nav button{border:0;background:transparent;color:#7b746e;font-size:10px;font-weight:650}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:#111;font-weight:800}.page{display:none;animation:fade .22s ease}.page.active{display:block}@keyframes fade{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}.ward-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.ward-title{font-family:Georgia,serif;font-size:42px;font-weight:500;letter-spacing:-1.6px}.tabs{display:flex;gap:8px;margin-bottom:16px}.pill{border:0;border-radius:999px;padding:10px 16px;background:#ebe4dd;font-size:12px;font-weight:700}.pill.active{background:#171614;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{border:1px solid var(--line);border-radius:19px;overflow:hidden;background:var(--paper);text-align:left;padding:0}.card .pic{aspect-ratio:1/1;background:var(--c);position:relative;overflow:hidden}.card .pic img{width:100%;height:100%;object-fit:contain;display:block;background:#f1ebe5;padding:8px}.card .pic::after{display:none}.card .meta{padding:10px 11px 12px}.card strong{font-size:13px;display:block}.card small{font-size:10px;color:var(--muted)}.add-card .pic{display:grid;place-items:center;background:#eee7df}.add-card .pic::after{display:none}.plus{width:54px;height:54px;border-radius:50%;background:#171614;color:white;display:grid;place-items:center;font-size:30px}.placeholder{padding:80px 12px;text-align:center}.placeholder h2{font-family:Georgia,serif;font-weight:500;font-size:38px;margin:0 0 8px}.placeholder p{color:var(--muted);line-height:1.5}@media(max-width:370px){.app{padding-left:14px;padding-right:14px}.title{font-size:44px}.hero{min-height:470px}}

.dressing-shell{min-height:calc(100vh - 122px);display:flex;flex-direction:column;gap:12px}.dress-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px}.dress-back,.dress-bag{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,253,249,.9);display:grid;place-items:center;font-size:20px}.dress-heading{font-family:Georgia,serif;font-size:28px;font-weight:500;letter-spacing:-.6px}.dress-stage{position:relative;flex:1;min-height:600px;border-radius:30px;background:linear-gradient(180deg,#faf7f3,#eee5dd);overflow:hidden;border:1px solid rgba(210,198,188,.72);box-shadow:0 24px 60px rgba(48,37,29,.08)}.avatar-photo{position:absolute;inset:58px 72px 120px 72px;width:calc(100% - 144px);height:calc(100% - 178px);object-fit:cover;object-position:center top;filter:saturate(.94) contrast(.98);border-radius:24px}.body-zones{position:absolute;left:12px;top:66px;bottom:126px;display:flex;flex-direction:column;justify-content:center;gap:12px;z-index:3}.zone-btn{width:58px;min-height:58px;border:1px solid var(--line);border-radius:20px;background:rgba(255,253,249,.88);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700}.zone-btn span{font-size:20px}.zone-btn.active{border-color:#bd8787;box-shadow:0 0 0 2px rgba(184,115,115,.12);background:#fffaf7}.item-rail{position:absolute;right:12px;top:82px;bottom:138px;width:64px;display:flex;flex-direction:column;justify-content:center;gap:10px;z-index:3}.rail-item{width:62px;height:62px;padding:5px;border-radius:20px;border:1px solid var(--line);background:rgba(255,253,249,.9);overflow:hidden}.rail-item img{width:100%;height:100%;object-fit:contain;border-radius:14px;background:#f3ece6}.rail-item.active{border-color:#bd8787;box-shadow:0 0 0 2px rgba(184,115,115,.13)}.active-category{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(255,253,249,.9);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:8px 18px;text-align:center;z-index:4;min-width:108px}.active-category strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.active-category small{font-size:9px;color:var(--muted)}.dress-actions{position:absolute;left:12px;right:12px;bottom:12px;height:78px;border:1px solid var(--line);border-radius:24px;background:rgba(255,253,249,.94);backdrop-filter:blur(16px);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;z-index:5}.dress-action{border:0;background:transparent;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:800}.dress-action span{font-size:23px;font-weight:400}.dress-action.save span{width:54px;height:54px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:25px;margin-top:-18px;box-shadow:0 9px 22px rgba(0,0,0,.18)}.dress-action.save{font-size:9px}.dress-hint{font-size:11px;color:var(--muted);text-align:center;margin:0 10px 2px}.rail-fade{animation:railFade .2s ease}@keyframes railFade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:380px){.dress-stage{min-height:560px}.avatar-photo{inset:56px 62px 118px 62px;width:calc(100% - 124px);height:calc(100% - 174px)}.zone-btn{width:52px;min-height:52px}.item-rail{width:58px}.rail-item{width:56px;height:56px}}
</style></head><body>
<main class="app">
<section class="page active" data-page="home"><div class="top"><h1 class="title">Home</h1><button class="icon-btn" aria-label="Settings">⚙</button></div><div class="greet">Good evening, Bea ☀️</div><div class="sub">Pronta a creare qualcosa di bello?</div><section class="hero"><img src="https://pub-3f5cbba8b6754c5a911ef894c797f7b0.r2.dev/Model-images/Female_Model_3.png" alt="Outfit WardRobe"><div class="chipbox weather"><b>22° ☀️</b><small>Soleggiato · Roma</small></div><div class="chipbox occasion"><small>Occasione</small><b>Everyday⌄</b></div><button class="cta" data-open="dressing">Change look →</button></section><section class="stats"><button class="stat" data-open="looks"><small>Ultimo look salvato</small><strong>Dinner date</strong><small>2 giorni fa</small></button><button class="stat" data-open="wardrobe"><small>Capi aggiunti</small><strong>12</strong><small>Questa settimana</small></button></section></section>
<section class="page" data-page="wardrobe"><div class="ward-head"><h1 class="ward-title">Wardrobe</h1><button class="icon-btn">⌕</button></div><div class="tabs"><button class="pill active">Tutti i capi</button><button class="pill">Recenti</button></div><div class="grid">
<button class="card"><div class="pic"><img src="https://img105.savana.com/goods-pic/43fb2fdc9e0e43c78c6db6639aa42bc4UR_w1440_q90.webp" alt="Tops"></div><div class="meta"><strong>Tops</strong><small>32 capi</small></div></button>
<button class="card"><div class="pic"><img src="https://www.fotoboxpro.com/wp-content/uploads/kot-pantolon-dekupe-fotograf-cekimi-zara-tarzi-1.jpg" alt="Bottoms"></div><div class="meta"><strong>Bottoms</strong><small>18 capi</small></div></button>
<button class="card"><div class="pic"><img src="https://img01.ztat.net/article/spp-media-p1/89d8eeac47604d4aaf6055c91e5a1117/ba1f1bdf6837437a869f3cafe2ea499c.jpg?filter=packshot&imwidth=1800" alt="Dresses"></div><div class="meta"><strong>Dresses</strong><small>10 capi</small></div></button>
<button class="card"><div class="pic"><img src="https://cdn.grupoelcorteingles.es/SGFM/dctm/MEDIA03/202008/19/00112250200123____10__967x1200.jpg" alt="Jackets"></div><div class="meta"><strong>Jackets</strong><small>12 capi</small></div></button>
<button class="card"><div class="pic" style="--c:#d9d5cf"></div><div class="meta"><strong>Shoes</strong><small>20 capi</small></div></button>
<button class="card"><div class="pic" style="--c:#1f1d1b"></div><div class="meta"><strong>Bags</strong><small>15 capi</small></div></button>
<button class="card"><div class="pic" style="--c:#cbb79f"></div><div class="meta"><strong>Accessories</strong><small>28 capi</small></div></button>
<button class="card add-card" id="addItem"><div class="pic"><div class="plus">+</div></div><div class="meta"><strong>Add item</strong><small>Camera / gallery</small></div></button>
</div></section>
<section class="page" data-page="dressing"><div class="dressing-shell"><div class="dress-top"><button class="dress-back" data-open="home" aria-label="Indietro">×</button><div class="dress-heading">Dressing Room</div><button class="dress-bag" data-open="wardrobe" aria-label="Wardrobe">♧</button></div><div class="dress-stage" id="dressingStage"><img class="avatar-photo" id="dressingAvatar" src="https://pub-3f5cbba8b6754c5a911ef894c797f7b0.r2.dev/Model-images/Female_Model_3.png" alt="Avatar WardRobe"><div class="body-zones"><button class="zone-btn" data-category="head"><span>◡</span>Head</button><button class="zone-btn active" data-category="top"><span>♙</span>Top</button><button class="zone-btn" data-category="bottom"><span>▯</span>Bottom</button><button class="zone-btn" data-category="shoes"><span>⌁</span>Shoes</button><button class="zone-btn" data-category="bag"><span>◒</span>Bag</button><button class="zone-btn" data-category="acc"><span>⌁</span>Acc.</button></div><div class="item-rail" id="dressingItemRail"></div><div class="active-category"><strong id="activeCategoryLabel">TOPS</strong><small id="activeCategoryCount">4 capi</small></div><div class="dress-actions"><button class="dress-action" id="shuffleLook"><span>⌘</span>SHUFFLE</button><button class="dress-action save" id="saveLook"><span>♡</span>SAVE LOOK</button><button class="dress-action" id="resetLook"><span>↻</span>RESET</button></div></div><p class="dress-hint">Tocca una zona o fai swipe sull'avatar per cambiare capo.</p></div></section>
<section class="page" data-page="looks"><div class="placeholder"><h2>Looks</h2><p>I look salvati arriveranno qui. Questa schermata è già raggiungibile dalla nav.</p></div></section>
</main>
<nav class="nav"><button class="active" data-open="home"><span>⌂</span>Home</button><button data-open="wardrobe"><span>♙</span>Wardrobe</button><button data-open="dressing"><span>♢</span>Dressing</button><button data-open="looks"><span>♡</span>Looks</button></nav>
<input id="filePicker" type="file" accept="image/*" hidden>
<script>
const pages=[...document.querySelectorAll('[data-page]')], nav=[...document.querySelectorAll('.nav button')];
function openPage(name){pages.forEach(p=>p.classList.toggle('active',p.dataset.page===name));nav.forEach(b=>b.classList.toggle('active',b.dataset.open===name));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.open)));
document.getElementById('addItem').addEventListener('click',()=>document.getElementById('filePicker').click());
document.getElementById('filePicker').addEventListener('change',e=>{if(e.target.files?.[0]) alert('Foto selezionata: '+e.target.files[0].name+' — nel prossimo step la salviamo nel Wardrobe.')});

const dressingItems={
  head:[['https://cdn-icons-png.flaticon.com/512/892/892458.png','Head 1'],['https://cdn-icons-png.flaticon.com/512/892/892499.png','Head 2']],
  top:[['https://img105.savana.com/goods-pic/43fb2fdc9e0e43c78c6db6639aa42bc4UR_w1440_q90.webp','Black top'],['https://img01.ztat.net/article/spp-media-p1/89d8eeac47604d4aaf6055c91e5a1117/ba1f1bdf6837437a869f3cafe2ea499c.jpg?filter=packshot&imwidth=1800','Cream top'],['https://cdn.grupoelcorteingles.es/SGFM/dctm/MEDIA03/202008/19/00112250200123____10__967x1200.jpg','Dark top'],['https://modernminimalism.com/wp-content/uploads/2023/04/Reformation-Minimalist-Clothing-Brand.png','Soft top']],
  bottom:[['https://www.fotoboxpro.com/wp-content/uploads/kot-pantolon-dekupe-fotograf-cekimi-zara-tarzi-1.jpg','Blue jeans'],['https://images.pexels.com/photos/1598507/pexels-photo-1598507.jpeg?auto=compress&cs=tinysrgb&w=500','Denim']],
  shoes:[['https://images.squarespace-cdn.com/content/v1/5270d7bee4b08e5b9b952d75/1515647799354-XG233OB49PEIABZIA4S4/e1d12aa5b7ad7b206ab0599994452b85.jpg','Sneakers'],['https://images.pexels.com/photos/267320/pexels-photo-267320.jpeg?auto=compress&cs=tinysrgb&w=500','Shoes']],
  bag:[['https://images.pexels.com/photos/1152077/pexels-photo-1152077.jpeg?auto=compress&cs=tinysrgb&w=500','Bag'],['https://images.pexels.com/photos/904350/pexels-photo-904350.jpeg?auto=compress&cs=tinysrgb&w=500','Bag 2']],
  acc:[['https://images.pexels.com/photos/701877/pexels-photo-701877.jpeg?auto=compress&cs=tinysrgb&w=500','Glasses'],['https://images.pexels.com/photos/190819/pexels-photo-190819.jpeg?auto=compress&cs=tinysrgb&w=500','Watch']]
};
let activeCategory='top',activeItemIndex=0;
function setActiveCategory(category){activeCategory=category;activeItemIndex=0;document.querySelectorAll('.zone-btn').forEach(b=>b.classList.toggle('active',b.dataset.category===category));renderDressingRail()}
function renderDressingRail(){const rail=document.getElementById('dressingItemRail');if(!rail)return;const items=dressingItems[activeCategory]||[];rail.innerHTML=items.map((item,i)=>`<button class="rail-item ${i===activeItemIndex?'active':''}" data-item-index="${i}"><img src="${item[0]}" alt="${item[1]}"></button>`).join('');rail.classList.remove('rail-fade');void rail.offsetWidth;rail.classList.add('rail-fade');document.getElementById('activeCategoryLabel').textContent=activeCategory==='acc'?'ACCESSORIES':activeCategory.toUpperCase();document.getElementById('activeCategoryCount').textContent=`${items.length} capi`;rail.querySelectorAll('.rail-item').forEach(b=>b.addEventListener('click',()=>{activeItemIndex=Number(b.dataset.itemIndex);renderDressingRail()}))}
function cycleDressingItem(direction){const items=dressingItems[activeCategory]||[];if(!items.length)return;activeItemIndex=(activeItemIndex+direction+items.length)%items.length;renderDressingRail()}
document.querySelectorAll('.zone-btn').forEach(b=>b.addEventListener('click',()=>setActiveCategory(b.dataset.category)));
document.getElementById('shuffleLook')?.addEventListener('click',()=>{const keys=['top','bottom','shoes','bag'];setActiveCategory(keys[Math.floor(Math.random()*keys.length)]);activeItemIndex=Math.floor(Math.random()*(dressingItems[activeCategory]?.length||1));renderDressingRail()});
document.getElementById('saveLook')?.addEventListener('click',()=>alert('Look salvato ♡'));
document.getElementById('resetLook')?.addEventListener('click',()=>{activeCategory='top';activeItemIndex=0;setActiveCategory('top')});
let touchStartX=0,touchStartY=0;document.getElementById('dressingStage')?.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX;touchStartY=e.changedTouches[0].screenY},{passive:true});document.getElementById('dressingStage')?.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchStartX,dy=e.changedTouches[0].screenY-touchStartY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))cycleDressingItem(dx>0?-1:1)},{passive:true});
renderDressingRail();

navigator.serviceWorker?.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if('caches'in window)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
</script></body></html>
